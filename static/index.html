<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes 服務控制台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Hermes 服務控制台</h1>
    <div class="meta">
      <span id="clock">—</span>
      <button id="refresh" title="立即重整">↻</button>
    </div>
  </header>

  <main>
    <table id="svc-table">
      <thead>
        <tr>
          <th>服務</th>
          <th>狀態</th>
          <th>健康</th>
          <th>PID</th>
          <th>運行時間</th>
          <th class="actions-col">操作</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6" class="empty">載入中…</td></tr>
      </tbody>
    </table>
    <p class="hint">面板只綁 127.0.0.1。要啟停面板自己,請在終端機用 <code>./panelctl</code>。</p>
  </main>

  <!-- log 抽屜 -->
  <div id="log-overlay" class="hidden">
    <div id="log-box">
      <div id="log-head">
        <span id="log-title">log</span>
        <label class="auto"><input type="checkbox" id="log-auto" checked> 自動更新</label>
        <button id="log-close">✕</button>
      </div>
      <pre id="log-body">…</pre>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
