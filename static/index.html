<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="appTitle">launchd Service Panel</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1 data-i18n="appTitle">launchd Service Panel</h1>
    <div class="meta">
      <span id="clock">—</span>
      <button id="lang-toggle" title="Switch language">中</button>
      <button id="refresh" data-i18n-title="refreshTitle" title="Refresh now">↻</button>
    </div>
  </header>

  <main>
    <table id="svc-table">
      <thead>
        <tr>
          <th data-i18n="colService">Service</th>
          <th data-i18n="colStatus">Status</th>
          <th data-i18n="colHealth">Health</th>
          <th data-i18n="colPid">PID</th>
          <th data-i18n="colUptime">Uptime</th>
          <th class="actions-col" data-i18n="colActions">Actions</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6" class="empty" data-i18n="loading">Loading…</td></tr>
      </tbody>
    </table>
    <p class="hint" id="hint"></p>
  </main>

  <!-- log drawer -->
  <div id="log-overlay" class="hidden">
    <div id="log-box">
      <div id="log-head">
        <span id="log-title">log</span>
        <label class="auto"><input type="checkbox" id="log-auto" checked> <span data-i18n="autoRefresh">auto-refresh</span></label>
        <button id="log-close">✕</button>
      </div>
      <pre id="log-body">…</pre>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
